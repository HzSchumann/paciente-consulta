version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-tech-challenge
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: paciente_consulta
      POSTGRES_PASSWORD: paciente_consulta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paciente_consulta -d agendamento"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-tech-challenge
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres-data:
